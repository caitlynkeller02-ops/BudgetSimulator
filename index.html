<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget Simulator - Money Moves</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      padding: 60px 40px;
      text-align: center;
      max-width: 600px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    h1 {
      font-size: 48px;
      margin: 0 0 20px;
      color: #17324d;
    }
    .emoji {
      font-size: 80px;
      margin-bottom: 20px;
      display: block;
    }
    p {
      font-size: 18px;
      color: #555;
      line-height: 1.6;
      margin: 15px 0;
    }
    .cta-button {
      display: inline-block;
      margin-top: 30px;
      padding: 18px 50px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-decoration: none;
      font-size: 20px;
      font-weight: bold;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    }
    .cta-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
    }
    .cta-button:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="emoji">💰</span>
    <h1>Money Moves</h1>
    <h2 style="color: #667eea; font-size: 24px; margin-top: 0;">Classroom Budget Challenge</h2>
    <p>You're in charge of your money for one month. Make smart choices, handle surprises, and see how well you can budget!</p>
    <p style="font-size: 14px; color: #999;">Learn the basics of personal finance through an interactive simulation.</p>
    <a href="budget-challenge.html" class="cta-button">Start the Challenge 🚀</a>
  </div>
</body>
</html>
